services:
  - type: web
    name: lebolink-api
    env: node
    region: ohio
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BOOKING_FLAT_FEE
        value: "499"
      - key: BOOKING_CURRENCY
        value: INR
